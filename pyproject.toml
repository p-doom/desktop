[project]
# `desktop` must stay distinct from `desktop_env`. That distribution AND import
# name belong to xlang-ai/desktop_env (OSWorld), which callers import alongside
# this package to score the benchmark -- and sys.path cannot override an entry
# already in sys.modules, so two packages cannot share one import name when a
# process needs both.
#
# `desktop` is not unclaimed either: PyPI's `desktop` 0.4.2 ships an import
# package of the same name. Nothing here is published and every consumer
# resolves this tree by path, so a `pip install desktop` that silently installs
# that one instead is the failure to expect -- reported as a missing submodule,
# never as a conflict.
name = "desktop"
version = "0.1.0"
description = "Apply absolute-pixel input operations to a real desktop VM, and reset it. Grammar-free, stdlib-only."
requires-python = ">=3.12"

# One runtime dependency, and the bar for adding a second is high: this
# package's callers are training and eval stacks with large, mutually
# incompatible dependency graphs (JAX, torch, CUDA, vLLM pins), and a VM layer
# that pins broadly becomes a resolver conflict that looks like a training bug.
# HTTP is therefore urllib.request, and screenshots cross every boundary in this
# package as raw bytes. Pillow validates the screenshot boundary and readiness.
#
# Two external BINARIES are also assumed, because they are not Python and cannot
# be vendored: qemu-system-x86_64 and apptainer.
dependencies = ["pillow>=10"]

[project.optional-dependencies]
# Test-only. Nothing here may be imported by desktop/ itself.
dev = ["pytest>=8", "python-xlib==0.33"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Not `desktop*`: this repository once also held the `desktop_fleet` package, which
# is a separate distribution and must not be swept into this wheel.
include = ["desktop", "desktop.*"]

[tool.setuptools.package-data]
"desktop.vm.images" = ["*.def", "*.md", "*.patch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The pool does its startup, retirement and reaping on daemon threads, where an
# exception is otherwise invisible: the thread dies, the pool's error counters
# never learn, and a leaked VM looks like a healthy one.
filterwarnings = [
    "error::pytest.PytestUnhandledThreadExceptionWarning",
]
# A test that needs KVM is not a unit test. Mark it, so the default run is the
# set that passes on any node.
markers = [
    "kvm: requires a readable and writable /dev/kvm",
    "apptainer: requires the apptainer binary",
    "guest: requires a live guest agent",
    # A node may have /dev/kvm and still have no qemu binary -- on this cluster
    # qemu exists only inside the KVM-tier container -- so the binary is its own
    # gate, read from DESKTOP_ENV_QEMU_BIN / DESKTOP_ENV_QEMU_IMG_BIN.
    "needs_vm: requires a real qemu-img / qemu-system-x86_64 binary",
    "needs_build: requires a built .sif, via DESKTOP_ENV_TEST_SIF",
    # The two tiers are different images; a test for one says nothing about the
    # other, which is the point of the split.
    "needs_nonkvm_build: requires a built non-KVM .sif, via DESKTOP_ENV_TEST_NONKVM_SIF",
]

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
